---
# Base & Package Settings
nginx_package_name: "nginx"
nginx_ppa_use: false
nginx_ppa_version: "stable"
nginx_default_release: ""
nginx_remove_default_vhost: true
nginx_default_vhost_path: "/etc/nginx/sites-enabled/default"

# Service Control
nginx_service_state: "started"
nginx_service_enabled: true

# User, Process & PID Settings
nginx_user: "www-data"
nginx_worker_processes: "auto"
nginx_worker_connections: 1024
nginx_multi_accept: "off"
nginx_pid_file: "/var/run/nginx.pid"

# Hash Bucket & Performance Settings
nginx_server_names_hash_bucket_size: 64
nginx_server_names_hash_max_size: 512
nginx_types_hash_max_size: 2048
nginx_types_hash_bucket_size: 64

# Logging Settings
nginx_error_log: "/var/log/nginx/error.log warn"
nginx_access_log: "/var/log/nginx/access.log"
nginx_log_format: |-
  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"'

# Server & Connection Defaults
nginx_sendfile: "on"
nginx_tcp_nopush: "on"
nginx_tcp_nodelay: "on"
nginx_keepalive_timeout: 65
nginx_keepalive_requests: 100
nginx_server_tokens: "off"
nginx_client_max_body_size: "64m"

# Advanced / Optional Configuration Blocks
nginx_extra_conf_options: ""
nginx_extra_http_options: ""
nginx_mime_file_path: "mime.types"

# Proxy & Caching Variables (Prevents template failure)
nginx_proxy_cache_path: ""
nginx_proxy_temp_path: ""
nginx_proxy_connect_timeout: ""
nginx_proxy_send_timeout: ""
nginx_proxy_read_timeout: ""

# FastCGI Settings
nginx_fastcgi_cache_path: ""
nginx_fastcgi_temp_path: ""

# SSL / TLS Defaults
nginx_ssl_protocols: "TLSv1.2 TLSv1.3"
nginx_ssl_prefer_server_ciphers: "on"
nginx_ssl_ciphers: "HIGH:!aNULL:!MD5"
nginx_ssl_dhparam: ""

# GeoIP Settings
nginx_geoip_country: ""
nginx_geoip_city: ""

# TCP & Socket Settings
nginx_listen_ipv6: true
nginx_listen_peep: false

# Template Definitions
nginx_conf_template: "nginx.conf.j2"
nginx_vhost_template: "vhost.j2"

# Upstream Load Balancer Pool
nginx_upstreams:
  - name: myapp1
    strategy: "ip_hash"
    keepalive: 16
    servers:
      - "172.31.20.73 weight=5"
      - "172.31.31.213 weight=5"

# Managed Virtual Hosts
# Managed Virtual Hosts
nginx_vhosts:
  - listen: "80"
    server_name: "example.com"
    root: "/var/www/html"
    index: "index.php index.html index.htm"
    locations:
      - path: "/"
        proxy_pass: "http://myapp1"
    state: "present"
