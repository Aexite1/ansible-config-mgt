- name: Install Apache (httpd)
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Install Git
  ansible.builtin.dnf:
    name: git
    state: present

- name: Clone Tooling repository directly into web root
  ansible.builtin.git:
    repo: "https://github.com/francdomain/tooling.git"
    dest: /var/www/html
    version: main
    force: true

- name: Check if nested html directory exists
  ansible.builtin.stat:
    path: /var/www/html/html
  register: nested_html_folder

- name: Copy sub-folder content to web root
  ansible.builtin.copy:
    src: /var/www/html/html/
    dest: /var/www/html/
    remote_src: true
    # FIX: Changed from '0644' to allow directory traversal during copy
    mode: 'u=rwX,g=rX,o=rX'
  when: nested_html_folder.stat.exists

- name: Ensure /var/www/html/html sub-folder is removed
  ansible.builtin.file:
    path: /var/www/html/html
    state: absent

# FIX: Changed from copy to file module to fix permissions recursively
- name: Apply correct ownership and permissions across web root
  ansible.builtin.file:
    path: /var/www/html
    owner: apache
    group: apache
    recurse: yes
    mode: 'u=rwX,g=rX,o=rX'

- name: Ensure Apache service is started and enabled on boot
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

