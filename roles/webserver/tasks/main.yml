---
- name: Install Apache web server
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Enable and start Apache web server
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

- name: Install EPEL release package
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
    disable_gpg_check: true

- name: Install Remi repository package
  ansible.builtin.dnf:
    name: "http://rpms.remirepo.net/enterprise/remi-release-{{ ansible_facts['distribution_major_version'] }}.rpm"
    state: present
    disable_gpg_check: true

- name: Install dnf-utils package
  ansible.builtin.dnf:
    name: dnf-utils
    state: present

- name: Reset default PHP DNF module stream
  ansible.builtin.command:
    cmd: dnf module reset -y php
  changed_when: false

- name: Enable PHP 8.5 Remi module stream
  ansible.builtin.command:
    cmd: dnf module enable -y php:remi-8.5
  changed_when: false

- name: Install PHP and required extensions
  ansible.builtin.dnf:
    name:
      - php
      - php-opcache
      - php-gd
      - php-curl
      - php-mysqlnd
      - php-fpm
    state: present

- name: Install MySQL/MariaDB client and Git
  ansible.builtin.package:
    name:
      - "{{ 'mysql-server' if ansible_facts['os_family'] == 'Debian' else 'mariadb' }}"
      - git
    state: present

- name: Enable and start PHP-FPM service
  ansible.builtin.service:
    name: php-fpm
    state: started
    enabled: true

- name: Configure SELinux booleans for HTTPD
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - httpd_execmem
    - httpd_can_network_connect
    - httpd_can_network_connect_db
  when: ansible_facts['os_family'] == 'RedHat'

- name: Clone tooling repository into temporary location
  ansible.builtin.git:
    repo: https://github.com/francdomain/tooling.git
    dest: /tmp/tooling_repo
    force: true

- name: Copy cloned web assets to /var/www/html
  ansible.builtin.copy:
    src: /tmp/tooling_repo/html/
    dest: /var/www/html/
    remote_src: true

- name: Clean up temporary clone directory
  ansible.builtin.file:
    path: /tmp/tooling_repo
    state: absent
