---
- name: Deploy JFrog Artifactory OSS on Resource-Constrained t3.small
  hosts: all
  become: yes
  vars:
    swap_file_path: "/swapfile"
    swap_size_gb: "4"
    jfrog_home: "/opt/jfrog/artifactory"
    system_yaml_path: "/opt/jfrog/artifactory/var/etc/system.yaml"

  tasks:
    - name: 1. SWAP | Check if swap space is already active
      ansible.builtin.command: swapon --show
      register: swap_check
      changed_when: false

    - name: 2. SWAP | Allocate 4GB swap space to prevent OOM
      ansible.builtin.command: "fallocate -l {{ swap_size_gb }}G {{ swap_file_path }}"
      args:
        creates: "{{ swap_file_path }}"
      when: swap_check.stdout == ""

    - name: 3. SWAP | Set strict security permissions on swapfile
      ansible.builtin.file:
        path: "{{ swap_file_path }}"
        mode: '0600'
        owner: root
        group: root

    - name: 4. SWAP | Format and enable swap space
      block:
        - name: Build swap filesystem
          ansible.builtin.command: "mkswap {{ swap_file_path }}"
          when: swap_check.stdout == ""

        - name: Activate swap file instantly
          ansible.builtin.command: "swapon {{ swap_file_path }}"
          when: swap_check.stdout == ""

        - name: Persist swap across system reboots
          ansible.builtin.mount:
            name: none
            src: "{{ swap_file_path }}"
            fstype: swap
            opts: sw
            state: present
      rescue:
        - name: SWAP WARNING | Handle non-fatal swap allocation bypasses
          ansible.builtin.debug:
            msg: "Swap configuration skipped or encountered restrictions. Proceeding with caution."

    - name: 5. DNF | Flush repository package caches to preserve memory
      ansible.builtin.command: dnf clean all
      changed_when: false

    - name: 6. DEPENDENCIES | Install base operational utilities
      ansible.builtin.dnf:
        name:
          - curl
          - wget
          - tar
          - gzip
        state: present
      register: dnf_dep_install
      retries: 3
      delay: 5
      until: dnf_dep_install is success

    - name: 7. REPO | Add the official JFrog Artifactory OSS YUM channel
      ansible.builtin.yum_repository:
        name: artifactory-oss
        description: "JFrog Artifactory OSS Repository"
        baseurl: https://jfrog.io
        enabled: yes
        gpgcheck: yes
        gpgkey: https://releases.jfrog.io/artifactory/api/gpg/key/public

    - name: 8. APP | Install JFrog Artifactory OSS Package
      ansible.builtin.dnf:
        name: jfrog-artifactory-oss
        state: present
      register: artifactory_install
      retries: 3
      delay: 10
      until: artifactory_install is success

    - name: 9. CONFIG | Ensure unified variable configuration directory exists
      ansible.builtin.file:
        path: "{{ system_yaml_path | dirname }}"
        state: directory
        owner: artifactory
        group: artifactory
        mode: '0755'

    - name: 10. CONFIG | Apply Low-Memory Optimization and Derby Profiles
      ansible.builtin.copy:
        dest: "{{ system_yaml_path }}"
        content: |
          shared:
            node:
              name: "artifactory-node-1"
              ip: "0.0.0.0"
            extraJavaOpts: "-Xms512m -Xmx1g"
          artifactory:
            database:
              type: derby
        owner: artifactory
        group: artifactory
        mode: '0664'

    - name: 11. RECURSION | Fix permissions across primary workspace maps
      ansible.builtin.file:
        path: "{{ item }}"
        owner: artifactory
        group: artifactory
        recurse: yes
      loop:
        - "/var/opt/jfrog/artifactory"
        - "/opt/jfrog/artifactory"

    - name: 12. SERVICE | Register and cycle the daemon state engine
      block:
        - name: Reload systemd daemon configs
          ansible.builtin.systemd_service:
            daemon_reload: yes

        - name: Start and enable Artifactory service
          ansible.builtin.systemd_service:
            name: artifactory
            enabled: yes
            state: restarted

    - name: 13. COMPLETE | Output clean environment access summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "SUCCESS: JFrog Artifactory OSS has been optimized and deployed!"
          - "Memory footprint capped at 1GB Heap max to protect your t3.small."
          - "Please wait 3-5 minutes for the microservices to fully boot."
          - "Access Web UI via port 8082: http://your-ec2-ip:8082"
          - "=========================================================="
