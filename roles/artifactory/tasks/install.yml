---
# tasks/install.yml (Complete RHEL Optimized Artifactory OSS Installation with Java 25)

- name: Check if swap exists
  ansible.builtin.command: swapon --show
  register: swap_check
  changed_when: false
  become: true

- name: "Create swap space to prevent OOM (rc: 137) on small instances"
  block:
    - name: Allocate 2GB swap file
      ansible.builtin.command: dd if=/dev/zero of=/swapfile bs=128M count=16
      args:
        creates: /swapfile
      become: true

    - name: Set correct permissions on swapfile
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
      become: true

    - name: Make swap filesystem
      ansible.builtin.command: mkswap /swapfile
      when: swap_check.stdout == ""
      become: true

    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      when: swap_check.stdout == ""
      become: true
  ignore_errors: true

- name: Clean DNF cache to free memory
  ansible.builtin.command: dnf clean all
  become: true
  changed_when: false

- name: Install required dependencies (Java 25, curl, wget)
  ansible.builtin.dnf:
    name:
      - java-25-openjdk
      - curl
      - wget
    state: present
  become: true
  register: dnf_install
  retries: 3
  delay: 10
  until: dnf_install is success

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_version
  changed_when: false

- name: Display Java version
  ansible.builtin.debug:
    var: java_version.stderr_lines

- name: Install mikefarah yq parser required by Artifactory scripts
  ansible.builtin.get_url:
    url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    dest: /usr/bin/yq
    mode: '0755'
  become: true
  register: yq_download
  retries: 3
  delay: 5
  until: yq_download is success

- name: Add JFrog Artifactory YUM repository
  ansible.builtin.yum_repository:
    name: artifactory
    description: JFrog Artifactory YUM repo
    baseurl: https://releases.jfrog.io/artifactory/artifactory-rpms
    enabled: true
    gpgcheck: true
    gpgkey: https://releases.jfrog.io/artifactory/api/gpg/key/public
  become: true

- name: Install JFrog Artifactory OSS
  ansible.builtin.dnf:
    name: jfrog-artifactory-oss
    state: present
  become: true
  register: artifactory_install
  retries: 3
  delay: 10
  until: artifactory_install is success

- name: Ensure Artifactory etc directory exists
  ansible.builtin.file:
    path: /var/opt/jfrog/artifactory/etc
    state: directory
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true

- name: Ensure complete valid system.yaml configuration exists for OSS
  ansible.builtin.copy:
    dest: /var/opt/jfrog/artifactory/etc/system.yaml
    content: |
      shared:
        node:
          name: artifactory-node-1
      artifactory:
        database:
          type: derby
    owner: artifactory
    group: artifactory
    mode: '0644'
  become: true

- name: Ensure third-party/yq directory exists to satisfy script directory check
  ansible.builtin.file:
    path: /opt/jfrog/artifactory/app/third-party/yq
    state: directory
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true

- name: Place yq binary inside the third-party/yq directory structure
  ansible.builtin.copy:
    src: /usr/bin/yq
    dest: /opt/jfrog/artifactory/app/third-party/yq/yq
    remote_src: true
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true

- name: Recursively set ownership of Artifactory var directories
  ansible.builtin.file:
    path: /var/opt/jfrog/artifactory
    owner: artifactory
    group: artifactory
    recurse: true
  become: true

- name: Recursively set ownership of app installation directory
  ansible.builtin.file:
    path: /opt/jfrog/artifactory
    owner: artifactory
    group: artifactory
    recurse: true
  become: true

- name: Force filesystem sync to ensure file writes are committed
  ansible.builtin.command: sync
  become: true
  changed_when: false

- name: Reload systemd daemon to register service states cleanly
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Start and enable JFrog Artifactory service
  ansible.builtin.systemd:
    name: artifactory.service
    state: restarted
    enabled: true
  become: true

- name: Wait for Artifactory service to initialize
  ansible.builtin.pause:
    seconds: 30

- name: Verify status of JFrog Artifactory
  ansible.builtin.systemd:
    name: artifactory.service
    state: started
  register: service_status
  become: true

- name: Display Artifactory service status confirmation
  ansible.builtin.debug:
    msg: "Artifactory service is successfully running and active!"