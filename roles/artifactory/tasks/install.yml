---
# tasks/install.yml (RHEL Optimized with Automated Swap & DNF Cleanup)

- name: Check if swap exists
  ansible.builtin.command: swapon --show
  register: swap_check
  changed_when: false
  become: true

- name: "Create swap space to prevent OOM (rc: 137) on small instances"
  block:
    - name: Allocate 2GB swap file
      ansible.builtin.command: dd if=/dev/zero of=/swapfile bs=128M count=16
      args:
        creates: /swapfile
      become: true

    - name: Set correct permissions on swapfile
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
      become: true

    - name: Make swap filesystem
      ansible.builtin.command: mkswap /swapfile
      when: swap_check.stdout == ""
      become: true

    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      when: swap_check.stdout == ""
      become: true
  ignore_errors: true

- name: Clean DNF cache to free memory
  ansible.builtin.command: dnf clean all
  become: true
  changed_when: false

- name: Install required dependencies (Java 21 & curl)
  ansible.builtin.dnf:
    name:
      - java-21-openjdk
      - curl
    state: present
  become: true

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_version
  ignore_errors: true
  changed_when: false

- name: Display Java version
  ansible.builtin.debug:
    var: java_version.stderr_lines

- name: Add JFrog Artifactory YUM repository
  ansible.builtin.yum_repository:
    name: artifactory
    description: JFrog Artifactory YUM repo
    baseurl: https://releases.jfrog.io/artifactory/artifactory-rpms
    enabled: true
    gpgcheck: true
    gpgkey: https://releases.jfrog.io/artifactory/api/gpg/key/public
  become: true

- name: Install JFrog Artifactory OSS
  ansible.builtin.dnf:
    name: jfrog-artifactory-oss
    state: present
  become: true

- name: Ensure system.yaml configuration file exists
  ansible.builtin.file:
    path: /var/opt/jfrog/artifactory/etc/system.yaml
    state: touch
    mode: '0644'
  become: true
  ignore_errors: true

- name: Start and enable JFrog Artifactory service
  ansible.builtin.systemd:
    name: artifactory.service
    state: started
    enabled: true
  become: true

- name: Verify status of JFrog Artifactory
  ansible.builtin.command: systemctl status artifactory.service
  register: artifactory_status
  ignore_errors: true
  changed_when: false

- name: Display Artifactory service status
  ansible.builtin.debug:
    var: artifactory_status.stdout_lines