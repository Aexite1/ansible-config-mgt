---
# tasks/install.yml (With Journal Diagnostics)

- name: Check if swap exists
  ansible.builtin.command: swapon --show
  register: swap_check
  changed_when: false
  become: true

- name: "Create swap space to prevent OOM (rc: 137) on small instances"
  block:
    - name: Allocate 2GB swap file
      ansible.builtin.command: dd if=/dev/zero of=/swapfile bs=128M count=16
      args:
        creates: /swapfile
      become: true

    - name: Set correct permissions on swapfile
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
      become: true

    - name: Make swap filesystem
      ansible.builtin.command: mkswap /swapfile
      when: swap_check.stdout == ""
      become: true

    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      when: swap_check.stdout == ""
      become: true
  ignore_errors: true

- name: Clean DNF cache to free memory
  ansible.builtin.command: dnf clean all
  become: true
  changed_when: false

- name: Install required dependencies (Java 21 & curl)
  ansible.builtin.dnf:
    name:
      - java-21-openjdk
      - curl
    state: present
  become: true

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_version
  changed_when: false

- name: Display Java version
  ansible.builtin.debug:
    var: java_version.stderr_lines

- name: Add JFrog Artifactory YUM repository
  ansible.builtin.yum_repository:
    name: artifactory
    description: JFrog Artifactory YUM repo
    baseurl: https://releases.jfrog.io/artifactory/artifactory-rpms
    enabled: true
    gpgcheck: true
    gpgkey: https://releases.jfrog.io/artifactory/api/gpg/key/public
  become: true

- name: Install JFrog Artifactory OSS
  ansible.builtin.dnf:
    name: jfrog-artifactory-oss
    state: present
  become: true

- name: Ensure Artifactory etc directory exists
  ansible.builtin.file:
    path: /var/opt/jfrog/artifactory/etc
    state: directory
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true

- name: Ensure complete valid system.yaml configuration exists for OSS
  ansible.builtin.copy:
    dest: /var/opt/jfrog/artifactory/etc/system.yaml
    content: |
      shared:
        node:
          name: artifactory-node-1
      artifactory:
        database:
          type: derby
    owner: artifactory
    group: artifactory
    mode: '0644'
  become: true

- name: Recursively set ownership of Artifactory directories
  ansible.builtin.file:
    path: /var/opt/jfrog/artifactory
    owner: artifactory
    group: artifactory
    recurse: true
  become: true

- name: Start and enable JFrog Artifactory service
  ansible.builtin.systemd:
    name: artifactory.service
    state: started
    enabled: true
  become: true
  register: service_start_result
  ignore_errors: true

- name: Fetch journalctl logs if service start failed
  ansible.builtin.command: journalctl -u artifactory.service -n 50 --no-pager
  register: journal_logs
  when: service_start_result is failed
  changed_when: false
  become: true

- name: Display journalctl logs for troubleshooting
  ansible.builtin.debug:
    var: journal_logs.stdout_lines
  when: service_start_result is failed

- name: Fail explicitly if service start failed
  ansible.builtin.fail:
    msg: "Artifactory service failed to start. Check the journal logs above for the exact cause."
  when: service_start_result is failed