---
# tasks/install.yml (RHEL Artifactory OSS Installation - Final Permission Fix)

- name: Check if swap exists
  ansible.builtin.command: swapon --show
  register: swap_check
  changed_when: false
  become: true

- name: Create swap space to prevent OOM on small instances
  block:
    - name: Allocate 2GB swap file
      ansible.builtin.command: dd if=/dev/zero of=/swapfile bs=128M count=16
      args:
        creates: /swapfile

    - name: Set correct permissions on swapfile
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'

    - name: Make swap filesystem
      ansible.builtin.command: mkswap /swapfile
      when: swap_check.stdout == ""

    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      when: swap_check.stdout == ""
  rescue:
    - name: Warn if swap creation fails (non-fatal)
      ansible.builtin.debug:
        msg: "Swap creation skipped or failed, proceeding with installation anyway."
  become: true

- name: Clean DNF cache to free memory
  ansible.builtin.command: dnf clean all
  become: true
  changed_when: false

- name: Install required dependencies (Java 21 LTS, curl, wget)
  ansible.builtin.dnf:
    name:
      - java-21-openjdk
      - curl
      - wget
    state: present
  become: true
  register: dnf_install
  retries: 3
  delay: 10
  until: dnf_install is success

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_version
  changed_when: false

- name: Display Java version
  ansible.builtin.debug:
    var: java_version.stderr_lines

- name: Install mikefarah yq parser required by Artifactory scripts
  ansible.builtin.get_url:
    url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    dest: /usr/bin/yq
    mode: '0755'
  become: true
  register: yq_download
  retries: 3
  delay: 5
  until: yq_download is success

- name: Add JFrog Artifactory YUM repository
  ansible.builtin.yum_repository:
    name: artifactory
    description: JFrog Artifactory YUM repo
    baseurl: https://releases.jfrog.io/artifactory/artifactory-rpms
    enabled: true
    gpgcheck: true
    gpgkey: https://releases.jfrog.io/artifactory/api/gpg/key/public
  become: true

- name: Install JFrog Artifactory OSS
  ansible.builtin.dnf:
    name: jfrog-artifactory-oss
    state: present
  become: true
  register: artifactory_install
  retries: 3
  delay: 10
  until: artifactory_install is success

- name: Ensure Artifactory etc and security directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true
  loop:
    - /var/opt/jfrog/artifactory/etc
    - /var/opt/jfrog/artifactory/etc/security

- name: Generate master.key and join.key with correct ownership
  ansible.builtin.shell: |
    if [ ! -f /var/opt/jfrog/artifactory/etc/security/master.key ]; then
      openssl rand -hex 32 > /var/opt/jfrog/artifactory/etc/security/master.key
    fi
    if [ ! -f /var/opt/jfrog/artifactory/etc/security/join.key ]; then
      openssl rand -hex 32 > /var/opt/jfrog/artifactory/etc/security/join.key
    fi
    chown -R artifactory:artifactory /var/opt/jfrog/artifactory/etc/security
    chmod 700 /var/opt/jfrog/artifactory/etc/security
    chmod 400 /var/opt/jfrog/artifactory/etc/security/*.key
  become: true

- name: Ensure complete valid system.yaml configuration exists for OSS (Robust Single-Node Setup)
  ansible.builtin.copy:
    dest: /var/opt/jfrog/artifactory/etc/system.yaml
    content: |
      shared:
        node:
          name: "artifactory-node-1"
          ip: "127.0.0.1"
        java:
          home: "/usr/lib/jvm/java-21-openjdk"
      router:
        node:
          port: 8046
      access:
        security:
          useExternalTopology: true
      artifactory:
        database:
          type: derby
    owner: artifactory
    group: artifactory
    mode: '0644'
  become: true

- name: Ensure third-party/yq directory exists to satisfy script directory check
  ansible.builtin.file:
    path: /opt/jfrog/artifactory/app/third-party/yq
    state: directory
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true

- name: Place yq binary inside the third-party/yq directory structure
  ansible.builtin.copy:
    src: /usr/bin/yq
    dest: /opt/jfrog/artifactory/app/third-party/yq/yq
    remote_src: true
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true

- name: Recursively set ownership of Artifactory var and app directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: artifactory
    group: artifactory
    recurse: true
  become: true
  loop:
    - /var/opt/jfrog/artifactory
    - /opt/jfrog/artifactory

- name: Ensure existing Artifactory service is stopped cleanly
  ansible.builtin.systemd:
    name: artifactory.service
    state: stopped
  become: true
  failed_when: false
  changed_when: false

- name: Reload systemd daemon to register service states cleanly
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Start and enable JFrog Artifactory service
  ansible.builtin.systemd:
    name: artifactory.service
    state: restarted
    enabled: true
  become: true

- name: Wait for Artifactory service to initialize ports (extended timeout for first boot)
  ansible.builtin.wait_for:
    port: 8082
    delay: 15
    timeout: 300
  become: true

- name: Verify status of JFrog Artifactory service
  ansible.builtin.systemd:
    name: artifactory.service
    state: started
  register: service_status
  become: true

- name: Display Artifactory service status confirmation
  ansible.builtin.debug:
    msg: "Artifactory service is successfully running and active!"