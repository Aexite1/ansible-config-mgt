---
# tasks file for artifactory

- name: Include OS-specific variable definitions
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  ignore_errors: true

- name: Perform JFrog Artifactory Installation
  ansible.builtin.include_tasks: install.yml
  when:
    - artifactory_enabled | default(true)
    - not (artifactory_upgrade_only | default(false))

- name: Perform JFrog Artifactory Upgrade
  ansible.builtin.include_tasks: upgrade.yml
  when:
    - artifactory_enabled | default(true)
    - artifactory_upgrade_only | default(false)

- name: Ensure Artifactory etc and security directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: artifactory
    group: artifactory
    mode: '0755'
  become: true
  loop:
    - /var/opt/jfrog/artifactory/etc
    - /var/opt/jfrog/artifactory/etc/security

- name: Generate master.key and join.key with correct ownership
  ansible.builtin.shell: |
    if [ ! -f /var/opt/jfrog/artifactory/etc/security/master.key ]; then
      openssl rand -hex 32 > /var/opt/jfrog/artifactory/etc/security/master.key
    fi
    if [ ! -f /var/opt/jfrog/artifactory/etc/security/join.key ]; then
      openssl rand -hex 32 > /var/opt/jfrog/artifactory/etc/security/join.key
    fi
    chown -R artifactory:artifactory /var/opt/jfrog/artifactory/etc/security
    chmod 700 /var/opt/jfrog/artifactory/etc/security
    chmod 400 /var/opt/jfrog/artifactory/etc/security/*.key
  become: true