---
- name: Update web and NFS servers
  hosts: all
  become: true
  tasks:
    - name: Ensure wireshark is installed on Debian/Ubuntu hosts
      ansible.builtin.apt:
        name: wireshark
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Ensure wireshark is installed on RHEL/CentOS hosts
      ansible.builtin.dnf:
        name: wireshark
        state: latest
        use_backend: dnf4
      when: ansible_facts['os_family'] == "RedHat"