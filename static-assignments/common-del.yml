---
- name: Update web and NFS servers
  hosts: webservers, nfs
  remote_user: ec2-user
  become: yes
  tasks:
    - name: Ensure wireshark is removed on RHEL/CentOS hosts
      ansible.builtin.yum:
        name: wireshark
        state: absent

- name: Update LB and DB servers
  hosts: lb, db
  remote_user: ubuntu
  become: yes
  tasks:
    - name: Ensure wireshark is removed on Debian/Ubuntu hosts
      ansible.builtin.apt:
        name: wireshark
        state: absent
        autoremove: yes
        purge: yes